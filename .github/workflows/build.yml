name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Arlecchino.Commander.slnx --configuration Release

      - name: Render a frame
        run: >
          dotnet run --project src/Arlecchino.Commander --configuration Release --no-build
          -- --frame 120x30 --left . --right src
