name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Arlecchino.Commander.slnx --configuration Release

      - name: Run the tests
        run: dotnet test Arlecchino.Commander.slnx --configuration Release --no-build

      - name: Render a frame
        run: >
          dotnet run --project src/Arlecchino.Commander --configuration Release --no-build
          -- --frame 120x30 --left . --right src

      # The releases are compiled ahead of time, where anything reflection would only find at runtime
      # is gone. Building one here, and running it, is what keeps that from being found out on a tag.
      - name: Compile it ahead of time and run that
        run: |
          dotnet publish src/Arlecchino.Commander/Arlecchino.Commander.csproj \
            --configuration Release --runtime linux-x64 --output aot -p:PublishAot=true

          ./aot/Arlecchino.Commander --frame 120x30 --left . --right src
