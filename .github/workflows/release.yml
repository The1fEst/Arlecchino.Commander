name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, archive: zip, runs: true }
          - { os: windows-11-arm, rid: win-arm64, archive: zip, runs: true }
          - { os: ubuntu-latest, rid: linux-x64, archive: tar, runs: true }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, archive: tar, runs: true }
          - { os: macos-latest, rid: osx-arm64, archive: tar, runs: true }
          - { os: macos-latest, rid: osx-x64, archive: tar, runs: false }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read the version off the tag, or date one that has none
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "value=$(date -u +%Y).$((10#$(date -u +%m))).0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=${GITHUB_REF_NAME#v}

          if ! printf '%s' "$version" | grep -qE '^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::A version is year.month.build, as in v2026.8.1. $GITHUB_REF_NAME is not one." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Arlecchino.Commander/Arlecchino.Commander.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output out
          -p:Version=${{ steps.version.outputs.value }}

      - name: Run the frame it draws
        if: matrix.runs
        shell: bash
        run: |
          binary=out/Arlecchino.Commander
          [ -f "$binary.exe" ] && binary="$binary.exe"

          "$binary" --frame 120x30 --left . --right src

      - name: Archive
        id: archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          name="arlecchino-commander-$VERSION-${{ matrix.rid }}"

          rm -f out/*.pdb out/*.xml out/*.dwarf
          rm -rf out/*.dSYM

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "dist/$name.zip" ./out/* > /dev/null
          else
            chmod +x out/Arlecchino.Commander
            tar -C out -czf "dist/$name.tar.gz" .
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}

          case "$version" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          ls -la dist

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --generate-notes \
            $prerelease \
            dist/*
